    training_method:
      nullable: true
      allOf:
        - $ref: "#/FinetuneTrainingMethod"
    training_type:
      nullable: true
      allOf:
        - $ref: "#/FinetuneLaunchTrainingType"
    data_format:
      nullable: true
      allOf:
        - $ref: "#/FinetuneDataFormat"
    hyperparams:
      type: object
      nullable: true
      additionalProperties: true

FinetuneJobDto:
  type: object
  required:
    - finetune_job_id
    - dataset_id
    - provider
    - status
    - model
    - provider_job_id

# Dataset update schema
PatchDatasetDto:
  type: object
  properties:
    name:
      type: string
      description: New name for the dataset
      maxLength: 255
    description:
      type: string
      description: New description for the dataset

# Credits calculation schemas
InsufficientCreditsInfoDto:
  type: object
  required:
    - creditsRequired
    - creditsAvailable
  properties:
    creditsRequired:
      type: number
      description: Credits required to run the pipeline
    creditsAvailable:
      type: number
      description: Credits currently available

ExpansionInfoDto:
  type: object
  required:
    - type
    - sampleRate
    - targetCount
    - expansionFactor
  properties:
    type:
      type: string
      description: Type of expansion (translate or localize)
      enum: [translate, localize]
      nullable: true
    sampleRate:
      type: number
      description: Sample rate for expansion (0-1)
    targetCount:
      type: number
      description: Number of target languages or countries
    expansionFactor:
      type: number
      description: Expansion factor applied to row count (1 + sampleRate * targetCount)

CreditsCalculationResponseDto:
  type: object
  required:
    - availableCredits
    - costFullDataset
    - costRequestedRows
    - maxRowsProcessable
  properties:
    availableCredits:
      type: number
      description: User's total available credits (org balance)
    costFullDataset:
      type: number
      description: Cost in credits for processing full dataset (dataset.row_count)
    costRequestedRows:
      type: number
      description: Cost in credits for the requested/specified number of rows (samples_to_process or full)
    maxRowsProcessable:
      type: number
      description: Max number of rows user can process with current credits (based on ROWS_PER_CREDIT)
    estimatedOutputRows:
      type: number
      description: Estimated output rows after expansion (equals input rows if no expansion)
    expansionConfig:
      description: Expansion configuration (translation/localization) if enabled
      allOf:
        - $ref: "#/ExpansionInfoDto"
    insufficientCredits:
      description: Present when available credits are insufficient for the requested rows (same shape as launch 402)
      nullable: true
      allOf:
        - $ref: "#/InsufficientCreditsInfoDto"

PreprocessingCreditsResponseDto:
  type: object
  required:
    - availableCredits
    - extractionCost
    - totalPages
    - totalDocuments
    - completedDocuments
    - isFinal
  properties:
    availableCredits:
      type: number
      description: Organization credit balance
    extractionCost:
      type: number
      description: Credits needed for document extraction / preprocessing
    totalPages:
      type: number
      description: Total pages across documents (estimated until final)
    totalDocuments:
      type: number
      description: Number of document files
    completedDocuments:
      type: number
      description: Documents with finalized page counts
    isFinal:
      type: boolean
      description: True when extraction cost is final
    insufficientCredits:
      description: Present when credits are insufficient for extraction cost
      nullable: true
      type: object
      required:
        - creditsRequired
        - creditsAvailable
      properties:
        creditsRequired:
          type: number
        creditsAvailable:
          type: number

# Launch pipeline schema
LaunchRecipesDto:
  type: object
  properties:
    prompt_rephrase:
      type: boolean
      description: Rephrase prompts for variety and clarity
      example: true
    deduplication:
      type: boolean
      description: Remove near-duplicate rows
      example: true
    reasoning_traces:
      type: boolean
      description: Add reasoning traces to completions
      example: false

LaunchConfigDto:
  type: object
  properties:
    prompt_column:
      type: string
      description: Column name to use as the prompt/instruction field
      example: instruction
    completion_column:
      type: string
      description: Column name to use as the completion/response field
      example: response
    chat_column:
      type: string
      description: Column name containing chat/conversation data (alternative to prompt+completion)
      example: messages
    context_columns:
      type: array
      items:
        type: string
      description: Column names to include as context
      example:
        - context
    recipes:
      description: Augmentation recipe toggles. Omitted recipes use backend defaults.
      allOf:
        - $ref: "#/LaunchRecipesDto"

LaunchPipelineDto:
  type: object
  properties:
    samples_to_process:
      type: number
      description: Custom number of rows to process. If omitted, all rows (or env default) are used.
      minimum: 1
    config:
      description: Dataset configuration (column mapping, recipes). If omitted, uses previously saved config. Required if dataset is in awaiting_column_selection status.
      allOf:
        - $ref: "#/LaunchConfigDto"

LaunchPreprocessingDto:
  type: object
  properties:
    pages_to_process:
      type: number
      description: >-
        Maximum number of pages to process. Documents are included until this
        budget is reached. If omitted, all pages are processed (unless limited
        by documents_to_process).
      minimum: 1
    documents_to_process:
      type: number
      description: >-
        Maximum number of documents to process. If omitted, all documents are
        processed.
      minimum: 1

LaunchPipelineResponseDto:
  type: object
  required:
    - message
    - estimatedMinutes
    - estimatedCompletionAt
  properties:
    message:
      type: string
      description: Success message
    estimatedMinutes:
      type: number
      description: Estimated processing time in minutes
    estimatedCompletionAt:
      type: string
      format: date-time
      description: Estimated completion timestamp


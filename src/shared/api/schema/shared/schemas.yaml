    dataset_id:
      type: string
    provider:
      type: string
    status:
      type: string
    model:
      type: string
      nullable: true
    provider_job_id:
      type: string
      nullable: true
    model_output_name:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    launched_at:
      type: string
      format: date-time
      nullable: true
    completed_at:
      type: string
      format: date-time
      nullable: true
    error_message:
      type: string
      nullable: true
    progress_steps:
      type: number
      nullable: true
    progress_total_steps:
      type: number
      nullable: true
    training_events:
      type: object
      nullable: true
      additionalProperties: true
    evaluation_status:
      type: string
      nullable: true
    evaluation_results:
      type: object
      nullable: true
      additionalProperties: true

FinetuneJobsListDto:
  type: object
  required:
    - jobs
  properties:
    jobs:
      type: array
      items:
        $ref: "#/FinetuneJobDto"

ExperimentStatusDto:
  type: object
  required:
    - training_experiment_id

      type: array
      items:
        $ref: "#/DomainResponseDto"

RefreshResponseDto:
  type: object
  required:
    - access_token
  properties:
    access_token:
      type: string

VerifyResponseDto:
  type: object
  required:
    - message
  properties:
    message:
      type: string

LogoutResponseDto:
  type: object
  required:
    - message
  properties:
    message:
      type: string

UpdateUserApiKeysDto:
  type: object
  required:
    - token
    - provider
  properties:
    token:
      type: string
    provider:
      type: string

StoreProviderKeyDto:
  type: object
  required:
    - provider
    - api_key
  properties:
    provider:
      type: string
      enum:
        - together_ai
      description: Third-party inference provider
    api_key:
      type: string
      minLength: 8
      description: Plaintext API key; encrypted server-side before storage

ProviderKeySummaryDto:
  type: object
  required:
    - provider
    - key_hint
    - created_at
    - updated_at
  properties:
    provider:
      type: string
    key_hint:
      type: string
      description: Last characters of the key for display (e.g. ...abcd)
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ProviderKeyListDto:
  type: object
  required:
    - keys
  properties:
    keys:
      type: array
      items:
        $ref: "#/ProviderKeySummaryDto"

ValidateProviderKeyDto:
  type: object
  description: >-
    Optional plaintext key to validate (unsaved). Omit or send empty object to
    validate the stored key for this provider.
  properties:
    api_key:
      type: string
      description: When set, validates this value without persisting it

ValidateProviderKeyResponseDto:
  type: object
  required:
    - valid
  properties:
    valid:
      type: boolean

GetUserSettingsResponseDto:
  type: object
  required:
    - apiKeys
  properties:
    apiKeys:
      type: array
      items:
        $ref: "#/ApiKeyExists"

ApiKeyExists:
  type: object
  required:
    - provider
    - exists
  properties:
    provider:
      type: string
      enum:
        - huggingface
        - kaggle_oauth
        - google_sheets
    exists:
      type: boolean

CreateApiKeyDto:
  type: object
  required:
    - name
    - organizationId
  properties:
    name:
      type: string
      maxLength: 100
      example: My production key
    organizationId:
      type: string
      format: uuid
      example: org-uuid-here

CreateApiKeyResponseDto:
  type: object
  required:
    - id
    - keyPrefix
    - name
    - organizationId
    - createdAt
    - lastUsedAt
    - expiresAt
    - revokedAt
    - rawKey
  properties:
    id:
      type: string
    keyPrefix:
      type: string
      example: pt_live_a1b2c3d4
    name:
      type: string
    organizationId:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      nullable: true
    expiresAt:
      type: string
      format: date-time
      nullable: true
    revokedAt:
      type: string
      format: date-time
      nullable: true
    rawKey:
      type: string
      description: Raw key shown once only
      example: pt_live_a1b2c3d4...

ApiKeyResponseDto:
  type: object
  required:
    - id
    - keyPrefix
    - name
    - organizationId
    - createdAt
    - lastUsedAt
    - expiresAt
    - revokedAt
  properties:
    id:
      type: string
    keyPrefix:
      type: string
      example: pt_live_a1b2c3d4
    name:
      type: string
    organizationId:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      nullable: true
    expiresAt:
      type: string
      format: date-time
      nullable: true
    revokedAt:
      type: string
      format: date-time
      nullable: true


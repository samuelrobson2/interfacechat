        worker defaults.
    idempotency_key:
      type: string
      description: >-
        Client idempotency key for safe retries (duplicate key returns the same
        job).

BestFinetuneLaunchConfigResponseDto:
  type: object
  required:
    - best_job_config
  properties:
    best_job_config:
      nullable: true
      description: >-
        Launch-parity snapshot for the selected finetune run. Null when the job
        does not exist or has no persisted launch config.
      allOf:

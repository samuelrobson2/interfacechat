# Error schema
ErrorResponse:
  type: object
  required:
    - statusCode
    - message
  properties:
    statusCode:
      type: integer
      description: HTTP status code
    message:
      type: string
      description: Display message from Error base class (used for user-facing error display)
    responseMessage:
      type: string
      description: Original message from server (converted from array to string if needed)
    error:
      type: string
      description: Error type or additional error information
    code:
      type: string
      description: Error code for specific error types (e.g. BETA_ACCESS_REQUIRED)

# Dataset schemas
FileFormatEnum:
  type: string
  enum:
    - csv
    - json
    - jsonl
    - parquet
    - pdf
    - docx
    - pptx
    - xlsx
    - html
    - zip
    - txt

InitiateDto:
  type: object
  required:
    - name
    - file_format
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: Human-readable name for the dataset
    file_format:
      description: >
        Declared upload format. Document/tabular formats may also be inferred
        from the file extension on the server.
      allOf:
        - $ref: "#/FileFormatEnum"

InitiateResponseDto:
  type: object
  required:
    - upload_url
  properties:
    upload_url:
      type: string

CompleteUploadDto:
  type: object
  required:
    - s3_key
    - name
    - file_format
    - file_size_bytes
  properties:
    s3_key:
      type: string
      description: S3 object key from the presigned upload URL
    name:
      type: string
      minLength: 1
      maxLength: 255
    file_format:
      description: >
        Declared format of the uploaded bytes; server may align with extension.
      allOf:
        - $ref: "#/FileFormatEnum"
    file_size_bytes:
      type: number
      minimum: 0
      maximum: 2147483648

InitiateBatchFileDto:
  type: object
  required:
    - file_name
    - file_format
    - file_size_bytes
  properties:
    file_name:
      type: string
      minLength: 1
      maxLength: 512
      description: Original file name
    file_format:
      allOf:
        - $ref: "#/FileFormatEnum"
    file_size_bytes:
      type: number
      minimum: 1
      maximum: 104857600

InitiateBatchDto:
  type: object
  required:
    - name
    - files
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    files:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        $ref: "#/InitiateBatchFileDto"

InitiateBatchUploadDto:
  type: object
  required:
    - file_name
    - upload_url
    - s3_key
  properties:
    file_name:
      type: string
    upload_url:
      type: string
      description: Presigned S3 PUT URL
    s3_key:
      type: string

InitiateBatchResponseDto:
  type: object
  required:
    - dataset_id
    - uploads
  properties:
    dataset_id:
      type: string
    uploads:
      type: array
      items:
        $ref: "#/InitiateBatchUploadDto"

CompleteBatchFileDto:
  type: object
  required:
    - s3_key
    - file_name
    - file_format
    - file_size_bytes
  properties:
    s3_key:
      type: string
    file_name:
      type: string
      minLength: 1
      maxLength: 512
    file_format:
      allOf:
        - $ref: "#/FileFormatEnum"
    file_size_bytes:
      type: number
      minimum: 1
      maximum: 104857600

CompleteBatchDto:
  type: object
  required:
    - dataset_id
    - files
  properties:
    dataset_id:
      type: string
      format: uuid
    files:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        $ref: "#/CompleteBatchFileDto"

CompleteBatchResponseDto:
  type: object
  required:
    - dataset_id
    - status
  properties:
    dataset_id:
      type: string
    status:
      type: string
      description: Current dataset status after batch completion

CompleteUploadResponseDto:
  type: object
  required:
    - dataset_id
  properties:
    dataset_id:
      type: string

initiateProviderDownloadDto:
  type: object
  required:
    - url
    - files
  properties:
    url:
      type: string
    files:
      type: array
      items:
        type: string

# Legacy alias for backward compatibility
initiateHuggingfaceDownloadDto:
  type: object
  required:
    - url
    - files
  properties:
    url:
      type: string
    files:
      type: array
      items:
        type: string

MessageResponse:
  type: object
  required:
    - message
  properties:
    message:
      type: string

PublicDatasetProgressDto:
  type: object
  required:
    - percent
    - processed_rows
    - total_rows
  properties:
    percent:
      type: integer
      nullable: true
      description: Progress percentage (0-100)
    processed_rows:
      type: integer
      nullable: true
    total_rows:
      type: integer
      nullable: true

PublicDatasetErrorDto:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      description: Error message when status is failed

DatasetPublicErrorDataDto:
  type: object
  required:
    - message
    - code
    - level
  properties:
    message:
      type: string
      nullable: true
      description: User-visible error message
    code:
      type: string
      nullable: true
      description: Stable backend error code when available
    level:
      type: string
      nullable: true
      enum:
        - error
        - warning
      description: Error severity when available

PublicDatasetStatusResponseDto:
  type: object
  required:
    - dataset_id
    - status
    - dataset_type
    - row_count
    - progress
    - error_data
    - error
  properties:
    dataset_id:
      type: string
      description: Dataset ID
    dataset_type:
      type: string
      enum:
        - tabular
        - document
      description: Dataset modality
    status:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
      description: Public lifecycle status for polling
    row_count:
      type: integer
      nullable: true
      description: Number of rows in the dataset
    progress:
      nullable: true
      description: Processing progress; null when no run is active
      allOf:
        - $ref: "#/PublicDatasetProgressDto"
    error_data:
      nullable: true
      description: Structured error payload when failed; null otherwise
      allOf:
        - $ref: "#/DatasetPublicErrorDataDto"
    error:
      nullable: true
      description: Legacy alias for error payload when failed; null otherwise
      allOf:
        - $ref: "#/PublicDatasetErrorDto"

Field:
  type: object
  required:
    - id
    - form_id
    - key
    - title
    - input_type
  properties:
    id:
      type: number
    form_id:
      type: number
    key:
      type: string
    title:
      type: string
    description:
      type: string
      nullable: true
    input_type:
      type: string
    order:
      type: number
      nullable: true
    rate:
      type: number
      nullable: true
    relation:
      type: string
      nullable: true
      description: >
        On a trigger field: `key` of the follow-up field that must be skipped when
        the user selects the "no" option on this field. When the answer is not "no",
        the follow-up is included in the questionnaire flow.
    relation_type:
      type: string
      nullable: true
      description: Optional qualifier for relation semantics (reserved / backend-specific).
    options:
      type: array
      items:
        type: object
        required:
          - id
          - field_id
          - key
          - value
          - title
        properties:
          id:
            type: number
          field_id:
            type: number
          key:
            type: string
          value:
            type: string
          title:
            type: string
          description:
            type: string
            nullable: true
          info:
            type: string
            nullable: true
            description: Optional short note shown under the option (e.g. preprocessing hints).
          required_plans:
            type: array
            nullable: true
            items:
              type: object
              required:
                - plan_id
                - plan_name
              properties:
                plan_id:
                  type: string
                plan_name:
                  type: string
    editable:
      type: boolean
      nullable: true
    required_plans:
      type: array
      nullable: true
      items:
        type: object
        required:
          - plan_id
          - plan_name
        properties:
          plan_id:
            type: string
          plan_name:
            type: string
    has_access:
      type: boolean
      nullable: true
    enabled:
      type: boolean
      nullable: true
    response_values:
      type: array
      items:
        type: object
        required:
          - id
          - field_id
          - value
          - dataset_id
        properties:
          id:
            type: integer
          field_id:
            type: integer
          value:
            type: string
          dataset_id:
            type: string
            format: uuid

Step:
  type: object
  required:
    - id
    - key
    - step_name
    - title
    - description
    - order
    - created_at
    - completed
    - fields
  properties:
    id:
      type: number
    key:
      type: string
    step_name:
      type: string
    title:
      type: string
    description:
      type: string
      nullable: true
    order:
      type: number
    created_at:
      type: string
      format: date-time
    completed:
      type: boolean
    fields:
      type: object
      additionalProperties:
        $ref: "#/Field"

DatasetStepsResponseDto:
  type: object
  required:
    - steps
  properties:
    steps:
      type: array
      items:
        $ref: "#/Step"

DatasetStepResponseDto:
  type: object
  required:
    - step
  properties:
    step:
      $ref: "#/Step"

DatasetBrandControlDto:
  type: object
  properties:
    system_prompt:
      type: string
      nullable: true
      description: Blueprint / brand system prompt (runtime shape on dataset detail).

DatasetBaseNumiConfigDto:
  type: object
  properties:
    brandControl:
      nullable: true
      allOf:
        - $ref: "#/DatasetBrandControlDto"

DatasetDto:
  type: object
  required:
    - dataset_id
    - name
    - organization_id
    - row_count
    - samples_to_process
    - status
    - error_data
    - error_message
    - created_at
    - updated_at
    - columns
    - samples
    - metadata
    - run_id
    - job_id
    - column_samples
    - evaluation_grade_before
    - evaluation_grade_after
    - evaluation_run_id
    - evaluation_job_id
    - evaluation_status
    - evaluation_output_path
    - evaluation_results
    - upload_job_id
    - source
    - source_link
    - huggingface_export_link
    - kaggle_export_link
    - total_chunks
    - completed_chunks
    - failed_chunks
    - chunking_status
    - dataset_type
    - kind
    - sources
  properties:
    dataset_id:
      type: string
    name:
      type: string
      example: dataset name
    organization_id:
      type: string
    row_count:
      type: number
      nullable: true
    samples_to_process:
      type: number
      nullable: true
      description: "Custom limit for pipeline: number of rows to process"
    dataset_type:
      type: string
      enum:
        - tabular
        - document
      description: Dataset modality (tabular rows vs document extraction)
    kind:
      $ref: "#/DatasetKind"
    sources:
      type: array
      nullable: true
      description: >-
        Lineage for combined datasets — present when `kind === 'combined'`.
        Ordered by `order_index`. A `dataset_id` of `null` indicates the source
        dataset has been deleted.
      items:
        $ref: "#/DatasetSourceDto"
    preprocessing_mode:
      type: string
      nullable: true
      enum:
        - per_document
        - per_page
      description: >-
        Document datasets only — how preprocessing credits and assembly are
        scoped (per file vs per page).
    status:
      type: string
      enum:
        - uploading
        - awaiting_preprocessing
        - extracting_documents
        - processing
        - awaiting_column_selection
        - preprocessing_completed
        - processing_metadata
        - ready
        - failed
        - preprocessing_failed
        - launching
        - configuring
    error_data:
      nullable: true
      description: Structured error payload when failed; null otherwise
      allOf:
        - $ref: "#/DatasetPublicErrorDataDto"
    error_message:
      type: string
      description: Error message if dataset processing failed
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    columns:
      type: array
      items:
        type: string
      nullable: true
    samples:
      type: object
      nullable: true
    metadata:
      type: object
      nullable: true
    run_id:
      type: string
      nullable: true
    job_id:
      type: object
      nullable: true
    column_samples:
      type: object
      nullable: true
      additionalProperties:
        type: array
        items:
          type: string
    evaluation_run_id:
      type: string
      nullable: true
      description: run_name for SQS-based job discovery
    evaluation_job_id:
      type: string
      nullable: true
    evaluation_status:
      type: string
      nullable: true
    evaluation_output_path:
      type: string
      nullable: true
    evaluation_results:
      type: object
      nullable: true
      properties:
        gains:
          type: object
          properties:
            overall_percentage_gain:
              type: number
            message_quality_absolute_gain:
              type: number
            message_quality_percentage_gain:
              type: number
            completion_quality_absolute_gain:
              type: number
            completion_quality_percentage_gain:
              type: number
        columns:
          type: object
          properties:
            enhanced_prompt:
              type: string
            original_prompt:
              type: string
            enhanced_completion:
              type: string
            original_completion:
              type: string
        metrics:
          type: object
          properties:
            timings:
              type: object
              properties:
                data_loading:
                  type: number
                enhanced_quality:
                  type: number
                original_quality:
                  type: number
            timestamp:
              type: string
            row_counts:
              type: object
              properties:
                input:
                  type: number
            config_source:
              type: string
            reference_lance_path:
              type: string
            quality_percentile_after:
              type: object
              properties:
                quality_grade:
                  type: string
                quality_score:
                  type: number
                percentile_score:
                  type: number
                message_quality_percentile:
                  type: number
                dataset_avg_message_quality:
                  type: number
                completion_quality_percentile:
                  type: number
                dataset_avg_completion_quality:
                  type: number
                reference_mean_message_quality:
                  type: number
                reference_mean_completion_quality:
                  type: number
            quality_percentile_before:
              type: object
              properties:
                quality_grade:
                  type: string
                quality_score:
                  type: number
                percentile_score:
                  type: number
                message_quality_percentile:
                  type: number
                dataset_avg_message_quality:
                  type: number
                completion_quality_percentile:
                  type: number
                dataset_avg_completion_quality:
                  type: number
                reference_mean_message_quality:
                  type: number
                reference_mean_completion_quality:
                  type: number
        summary:
          type: object
          properties:
            message_quality:
              type: object
              properties:
                after:
                  type: number
                before:
                  type: number
                gains_percentage:
                  type: number
                percentile_after:
                  type: number
                percentile_before:
                  type: number
            completion_quality:
              type: object
              properties:
                after:
                  type: number
                before:
                  type: number
                gains_percentage:
                  type: number
                percentile_after:
                  type: number
                percentile_before:
                  type: number
        input_path:
          type: string
        quality_after:
          type: object
          properties:
            max_message_quality:
              type: number
            min_message_quality:
              type: number
            std_message_quality:
              type: number
            max_completion_quality:
              type: number
            median_message_quality:
              type: number
            min_completion_quality:
              type: number
            std_completion_quality:
              type: number
            average_message_quality:
              type: number
            median_completion_quality:
              type: number
            average_completion_quality:
              type: number
        quality_before:
          type: object
          properties:
            max_message_quality:
              type: number
            min_message_quality:
              type: number
            std_message_quality:
              type: number
            max_completion_quality:
              type: number
            median_message_quality:
              type: number
            min_completion_quality:
              type: number
            std_completion_quality:
              type: number
            average_message_quality:
              type: number
            median_completion_quality:
              type: number
            average_completion_quality:
              type: number
    evaluation_grade_before:
      type: string
      nullable: true
      description: Letter grade (A-E) from preprocessing scores
    evaluation_grade_after:
      type: string
      nullable: true
      description: Letter grade (A-E) from evaluation results
    upload_job_id:
      type: string
      nullable: true
    source:
      type: string
      nullable: true
    source_link:
      type: string
      nullable: true
    huggingface_export_link:
      type: string
      nullable: true
      description: URL on Hugging Face after dataset export is published; null until the backend sets it.
    kaggle_export_link:
      type: string
      nullable: true
      description: URL on Kaggle after dataset export is published; null until the backend sets it.
    total_chunks:
      type: number
      nullable: true
      description: Total number of chunks for chunked processing
    completed_chunks:
      type: number
      nullable: true
      description: Number of completed chunks
    failed_chunks:
      type: number
      nullable: true
      description: Number of failed chunks
    chunking_status:
      type: string
      nullable: true
      description: "Chunking status: pending, chunking, chunked, processing, completed, failed"
    finetune_eligibility:
      type: object
      nullable: true
      description: >-
        Pre-computed fine-tune eligibility for this dataset. Null when readiness
        has not been computed yet.
      properties:
        eligible:
          type: boolean
        reason:
          type: string
          nullable: true
        actions_visible:
          type: boolean
          description: >-
            When false, hide finetune CTAs on the dashboard (e.g. image context
            restrictions).
    latest_finetune:
      type: object
      nullable: true
      properties:
        finetune_job_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - preparing
            - augmenting
            - uploading
            - running
            - evaluating
            - succeeded
            - failed
            - eval_failed
            - cancelled
        progress_percentage:
          type: number
          nullable: true
        error_message:
          type: string
          nullable: true
          description: "Reason a finetune job failed. Pass-through from the provider or internal pipeline. Null unless status === 'failed'."
        training_experiment_id:
          type: string
    finetunes:
      type: array
      description: >-
        Completed fine-tune runs for this dataset, newest first — drives the
        trained-model dropdown on the dataset detail page. One entry per finished
        run attempt. Empty when the dataset has no completed runs. Detail
        endpoint only; not populated on the list endpoint.
      items:
        $ref: "#/DatasetFinetuneSummaryDto"
    system_prompt:
      type: string
      nullable: true
      description: >-
        Blueprint system prompt from brand controls (brand_custom_settings).
        Null if not configured.
    base_numi_config:
      nullable: true
      description: >-
        Saved pipeline / brand configuration blob. FE reads
        brandControl.system_prompt for the dashboard blueprint display.
      allOf:
        - $ref: "#/DatasetBaseNumiConfigDto"
    organization:
      $ref: "#/Organization"

DatasetExportLinksResponseDto:
  type: object
  properties:
    huggingface:
      type: string
      nullable: true
      description: URL of the dataset on Hugging Face, if a successful export exists
    kaggle:
      type: string
      nullable: true
      description: URL of the dataset on Kaggle, if a successful export exists
    google_sheets:
      type: string
      nullable: true
      description: URL of the Google Spreadsheet, if a successful export exists

DatasetKind:
  type: string
  description: >-
    Discriminator for how a dataset was produced. Derived in the service layer
    from the presence of `DatasetSource` rows — `combined` iff one or more
    sources exist, otherwise `uploaded`.
  enum:
    - uploaded
    - combined

DatasetFinetuneSummaryDto:
  type: object
  required:
    - job_id
  properties:
    name:
      type: string
      nullable: true
      description: >-
        Trained model output label (e.g. adaption_my_dataset). Display name in
        the trained-model dropdown.
    job_id:
      type: string
      format: uuid
      description: >-
        Fine-tune job id for job-scoped endpoints (metrics, download, config).

DatasetSourceDto:
  type: object
  required:
    - dataset_id
    - name
    - order_index
  properties:
    dataset_id:
      type: string
      nullable: true
      description: ID of the source dataset; null if the source has been deleted.
    name:
      type: string
      nullable: true
      description: >-
        Display name of the source dataset at combine time. Null if the source
        has been deleted and no snapshot was retained.
    order_index:
      type: number
      description: Position in the original combine selection (0-indexed).

CombineTrainingType:
  type: string
  description: >-
    Training dataset type shared by all sources in a successful combine.
    Mirrors the backend's `CombineTrainingType` discriminator.
  enum:
    - instruction_dataset
    - preference_pairs

CombineValidationError:
  type: object
  required:
    - code
    - message
  description: >-
    Structured validation failure returned by `POST /datasets/combine/validate`.
    `message` is the preformed user-facing string (names / limits / columns
    already interpolated); render it directly. `code` is for telemetry and
    discrimination only. The backend additionally returns per-code structured
    context fields (e.g. `count`, `limit`, `status`, `types`, `columns`) and a
    `level` field; those are intentionally not modelled here because the
    frontend does not consume them.
  properties:
    code:
      type: string
      enum:
        - too_few_sources
        - too_many_sources
        - duplicate_source_ids
        - dataset_not_found
        - wrong_organization
        - dataset_not_ready
        - missing_run_id
        - training_type_mismatch
        - missing_generations_with_rank
        - mixed_user_visible_columns
        - incompatible_column_types
    message:
      type: string
      description: User-facing display message produced by the backend.
    dataset_id:
      type: string
      description: >-
        Source dataset ID the error targets, when applicable (e.g.
        `dataset_not_found`, `dataset_not_ready`, `missing_run_id`,
        `missing_generations_with_rank`, `wrong_organization`).

CombineValidateDto:
  type: object
  required:
    - dataset_ids
  properties:
    dataset_ids:
      type: array
      items:
        type: string
      description: IDs of source datasets to validate for combination.

ValidateCombineSuccessDto:
  type: object
  required:
    - compatible
    - training_type
    - total_estimated_rows
  description: Successful validation. Sources are compatible to combine.
  properties:
    compatible:
      type: boolean
      enum: [true]
    training_type:
      allOf:
        - $ref: "#/CombineTrainingType"
      description: Training type shared by every source; inherited by the merged Dataset.
    total_estimated_rows:
      type: number
      description: Sum of processed_rows across all sources.

ValidateCombineFailureDto:
  type: object
  required:
    - compatible
    - errors
  description: >-
    Failed validation. Render each `error.message` directly; the array is
    guaranteed non-empty when `compatible === false`.
  properties:
    compatible:
      type: boolean
      enum: [false]
    errors:
      type: array
      items:
        $ref: "#/CombineValidationError"

CombineValidateResponseDto:
  oneOf:
    - $ref: "#/ValidateCombineSuccessDto"
    - $ref: "#/ValidateCombineFailureDto"
  description: >-
    Discriminated by `compatible`. On `true`, `training_type` and
    `total_estimated_rows` are present. On `false`, `errors` lists the
    structured failures.

CombineDatasetsDto:
  type: object
  required:
    - dataset_ids
    - name
  properties:
    dataset_ids:
      type: array
      items:
        type: string
      description: IDs of source datasets to combine, ordered by selection.
    name:
      type: string
      description: User-supplied name for the combined dataset.

CombineDatasetsResponseDto:
  type: object
  required:
    - dataset_id
  properties:
    dataset_id:
      type: string
      description: ID of the newly created combined Dataset row.

FormResponseDto:

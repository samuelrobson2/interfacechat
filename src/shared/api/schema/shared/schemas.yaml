      additionalProperties: true

FinetuneStepDetailResponseDto:
  type: object
  required:
    - step
  properties:
    step:
      $ref: "#/FinetuneStepDetailDto"

FinetuneInsufficientCreditsDto:
  type: object
  required:
    - creditsRequired
    - creditsAvailable
  properties:
    creditsRequired:
      type: number
    creditsAvailable:
      type: number

FinetuneCalculateResponseDto:
  type: object
  required:
    - availableCredits
    - baseTrainingRows
    - estimatedTrainingRows
    - costBaseTraining
    - costWithAugmentation
    - costAugmentationDomain
    - costAugmentationGeneral
    - augmentationRowsPerCredit
    - is_estimate_stub
    - minTrainingRows
    - meetsMinimumTrainingRows
  properties:
    availableCredits:
      type: number
      description: Current organization credit balance.
    baseTrainingRows:
      type: number
      description: Base training rows before augmentation.
    estimatedTrainingRows:
      type: number
      description: Estimated training rows after requested augmentation.
    costBaseTraining:
      type: number
      description: Estimated credits for base (no augmentation) run.
    costWithAugmentation:
      type: number
      description: Estimated credits including augmentation rows (= costBaseTraining + costAugmentationDomain + costAugmentationGeneral).
    costAugmentationDomain:
      type: number
      description: Credit cost for the requested domain augmentation rows alone (1 credit per 100 rows).
    costAugmentationGeneral:
      type: number
      description: Credit cost for the requested general augmentation rows alone (1 credit per 100 rows).
    augmentationRowsPerCredit:
      type: number
      description: Number of augmentation rows that 1 credit buys. FE uses this for instant optimistic per-slider cost without round-tripping every tick.
    is_estimate_stub:
      type: boolean
      description: True while backend uses a placeholder estimator for the base-training portion. Augmentation portion is locked at 1 credit per 100 rows.
    minTrainingRows:
      type: number
      description: Minimum effective training rows (base + augmentation) required to launch a fine-tune. Threshold lives only on the BE; FE binds Continue to meetsMinimumTrainingRows.
    meetsMinimumTrainingRows:
      type: boolean
      description: True when estimatedTrainingRows >= minTrainingRows. FE disables the augmentation Continue button when false.
    belowMinimumMessage:
      type: string
      nullable: true
      description: User-facing reason text when meetsMinimumTrainingRows is false. Null/absent when the dataset clears the floor.
    insufficientCredits:
      nullable: true
      allOf:
        - $ref: "#/FinetuneInsufficientCreditsDto"

FinetuneSaveConfigDto:
  type: object
  additionalProperties:
    type: object
    additionalProperties:
      type: object
      required:
        - value
      properties:
        value:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string
            - type: object
              additionalProperties: true

FinetuneHyperparamsRequestDto:
  type: object
  required:
    - model
    - training_method
    - base_model_size
  properties:
    model:
      type: string
      example: meta-llama/Llama-3-8b
    training_method:
      $ref: "#/FinetuneTrainingMethod"
    base_model_size:
      type: string
      pattern: "^\\d+[bBmM]$"
      example: 8B
      description: Model parameter count label, e.g. "8B", "70B", "130M"

FinetuneSftHyperparamsDto:
  type: object
  description: >-
    Together AI-compatible hyperparameter config from SFT suggestion.
    Empty object when training_method is DPO (provider defaults).
  additionalProperties: true
  properties:
    base_model_size:
      type: string
    n_epochs:
      type: number
    batch_size:
      oneOf:
        - type: string
        - type: number
    learning_rate:
      type: number
    lora:
      type: boolean
    lora_r:
      type: number
    lora_alpha:
      type: number
    lora_dropout:
      type: number
    lora_trainable_modules:
      type: string
    lr_scheduler_type:
      type: string
    min_lr_ratio:
      type: number
    scheduler_num_cycles:
      type: number
    warmup_ratio:
      type: number
    max_grad_norm:
      type: number
    weight_decay:
      type: number
    training_method:
      type: string
    train_on_inputs:
      type: boolean

FinetuneHyperparamsResponseDto:
  type: object
  required:
    - hyperparams
  properties:
    hyperparams:
      $ref: "#/FinetuneSftHyperparamsDto"

FinetuneHyperparamsValidateResponseDto:
  type: object
  description: >-
    Result of validating a hyperparameter draft against the same
    class-validator pipeline that runs on /finetune/launch. Errors are
    keyed by DTO property name (lora_r, lora_trainable_modules, etc.) so
    the FE can map them straight to its draft state.
  required:
    - valid
    - errors
  properties:
    valid:
      type: boolean
      description: True iff every supplied field passes validation.
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

FinetuneLaunchTrainingType:
  type: string
  enum:
    - lora
    - full

FinetuneDataFormat:
  type: string
  enum:
    - chat
    - instruction
    - preference

LaunchFinetuneJobDto:
  type: object
  required:
    - model
    - training_method
    - training_type
    - data_format
  properties:
    model:
      type: string
      example: meta-llama/Llama-3-8b
    training_method:
      $ref: "#/FinetuneTrainingMethod"
    training_type:
      $ref: "#/FinetuneLaunchTrainingType"
    data_format:

UpdateProfileResponseDto:
  type: object
  required:
    - name
    - homepage
    - bio
    - linkedin_username
    - github_username
    - x_username
    - languages
    - countries
    - domains
  properties:
    name:
      type: string
      nullable: true
    homepage:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    linkedin_username:
      type: string
      nullable: true
    github_username:
      type: string
      nullable: true
    x_username:
      type: string
      nullable: true
    languages:
      type: array
      items:
        $ref: "#/LanguageResponseDto"
    countries:
      type: array
      items:

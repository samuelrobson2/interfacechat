getSession:
  operationId: ChatController_getSession
  summary: Get session metadata
  description: >-
    Returns only the session row (including domain-tag metadata: `category`,
    `category_is_final`, `category_confidence`, `category_additional_domains`,
    `category_tagged_at`, `category_model`). Messages are NOT bundled in this
    response — fetch them separately via `GET
    /chat/sessions/{sessionId}/messages`. `category_is_final = false` indicates
    a preliminary tag from the first user turn — it will be replaced by the
    authoritative final tag once the session goes idle.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  responses:
    '200':
      description: 'Session retrieved successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSessionDto'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'


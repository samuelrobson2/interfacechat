    title_complete, or title_error before done.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/CreateUserMessageDto'
  responses:
    '201':
      description: 'SSE stream of assistant reply tokens'
      content:
        text/event-stream:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSseEventDto'
    '400':

stopActiveStream:
  operationId: ChatController_stopActiveStream
  summary: >-
    Stop the active SSE chat stream for this session (text LLM or interactive
    app generation). Emits `{ type: "cancelled" }` on the open stream when one
    is in flight.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  responses:
    '204':
      description: 'Stream cancelled'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'No active stream for this session'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

generateLatestFollowups:
  operationId: ChatController_generateLatestFollowups
  summary: >-
    Generate follow-up suggestions for the latest visible assistant message
    in the session. When `mode: "edits"` is passed (requires `highlighted`),
    the response is `kind: "section_edits"` with imperative edit
    instructions targeting only the highlighted passage; the user clicking
    one calls highlight-regenerate with `action.type: "followup"` and the
    body is applied as a user instruction. Otherwise: when the message is an
    interactive-app turn (response_types includes interactive_components)
    AND no highlight is supplied, the response is `kind: "app_edits"` with
    edit-style suggestions for the existing app, grounded in the agents
    internal stream + triggering user prompt. Otherwise the response is
    `kind: "context"` with generic chat follow-ups grounded in the last 3
    visible messages. Supersedes any prior stored set for that message.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/SessionFollowupsPostDto'
  responses:
    '201':
      description: 'Follow-up suggestions generated'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/SessionFollowupsResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

regenerateLatestAssistant:
  operationId: ChatController_regenerateLatestAssistant
  summary: >-
    Regenerate the latest assistant reply (SSE). The previous assistant
    message is superseded; its attachments remain on the old message.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  responses:
    '201':
      description: 'SSE stream of regenerated assistant reply tokens'
      content:
        text/event-stream:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSseEventDto'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

regenerateAssistantHighlight:
  operationId: ChatController_regenerateAssistantHighlight
  summary: >-
    Stream SSE tokens for a replacement substring on the latest assistant
    message only, then persist merged content. Send
    highlight_range_start/end (UTF-16 offsets) without requiring highlighted
    text to match; or omit range and send highlighted for first-match.
    Events: highlight_regen_start, token, done (includes full content).
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/HighlightRegenerateDto'
  responses:
    '201':
      description: 'SSE stream of highlight regeneration tokens'
      content:
        text/event-stream:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSseEventDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

generateHighlightImageSuggestions:
  operationId: ChatController_generateHighlightImageSuggestions
  summary: >-
    Generate short, image-conditioned edit suggestions for a
    user-highlighted rectangular region of an image attachment on the latest
    assistant message. The LLM is shown the image (vision) plus the bbox
    coordinates so suggestions reference content visible inside the
    highlight (e.g. "Change the color of the hat to blue"). Suggestions are
    ephemeral — clicking one should call /highlight-regenerate-image with
    action.type "prompt" using the suggestion text as value.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/HighlightImageSuggestionsDto'
  responses:
    '201':
      description: 'Highlight image suggestions generated'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/HighlightImageSuggestionsResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

regenerateAssistantHighlightImage:
  operationId: ChatController_regenerateAssistantHighlightImage
  summary: >-
    Edit a user-highlighted rectangular region of an image attachment on the
    latest assistant message (SSE). Pass attachment_id, normalized bbox
    {x,y,width,height} in [0,1], and an action of either {type:"regenerate"}
    or {type:"prompt", value:"..."}. The original attachment is superseded
    by a new ChatAttachment row containing the edited image. Events:
    image_edit_start, image_edit_progress, image_edit_done, done.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: sessionId
      required: true
      in: path
      schema:
        format: uuid
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/HighlightRegenerateImageDto'
  responses:
    '201':
      description: 'SSE stream of image highlight regeneration events'
      content:
        text/event-stream:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSseEventDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Session not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'


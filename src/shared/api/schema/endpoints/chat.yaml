# Chat endpoints

generateStarterSuggestions:
  operationId: ChatController_generateStarterSuggestions
  summary: >-
    Generate home-screen starter prompts for the authenticated user. Returns
    curated cold-start suggestions when the user has no usable conversation
    history, otherwise an LLM-generated set summarising themes from the
    user's most recent conversations. The set is persisted so click-throughs
    can be attributed via ChatMessage.starter_suggestion_id.
  tags:
    - chat
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/GenerateSuggestionsDto'
  responses:
    '201':
      description: 'Starter suggestions generated'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/StarterSuggestionsResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

createSession:
  operationId: ChatController_createSession
  summary: Create a chat session
  tags:
    - chat
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/CreateSessionDto'
  responses:
    '201':
      description: 'Session created successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSessionDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

listSessions:
  operationId: ChatController_listSessions
  summary: >-
    List chat sessions (newest first, cursor pagination). Filter with
    `directory_id` (favorites, uncategorized, folder UUID; domain slug
    accepted for backward compatibility), search titles with `q`, and
    restrict to sessions created on or after `created_after`.
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: cursor
      required: false
      in: query
      schema:
        format: uuid
        type: string
    - name: limit
      required: false
      in: query
      schema:
        minimum: 1
        maximum: 100
        default: 20
        type: number
    - name: directory_id
      required: false
      in: query
      description: >-
        Filter by directory: favorites, uncategorized, folder UUID, or
        domain slug (backward compatible).
      schema:
        maxLength: 100
        example: aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaaa
        type: string
    - name: q
      required: false
      in: query
      description: Case-insensitive search on session title.
      schema:
        maxLength: 200
        example: budget
        type: string
    - name: created_after
      required: false
      in: query
      description: Only return sessions created on or after this ISO-8601 timestamp.
      schema:
        example: '2026-01-15T00:00:00.000Z'
        type: string
  responses:
    '200':
      description: 'Sessions list retrieved successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ChatSessionsListDto'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

listDomainGroups:
  operationId: ChatController_listDomainGroups
  summary: >-
    List chat domain groups and their classifier domain slugs. Group `id` is
    a short stable key for client-side icon/color mapping.
  tags:
    - chat
  security:
    - bearer: []
  responses:
    '200':
      description: 'Domain groups retrieved successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ChatDomainGroupsResponseDto'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

listDirectories:
  operationId: ChatController_listDirectories
  summary: >-
    List chat directories with session counts (favorites, uncategorized, and
    folders with chats). Each folder row includes `id` (UUID) and `slug`
    (system folders only). Paginated with cursor; favorites and
    uncategorized are pinned to the first page. Use `domain_group` to filter
    to system folders in a domain group (hides virtual directories).
  tags:
    - chat
  security:
    - bearer: []
  parameters:
    - name: category
      required: false
      in: query
      description: >-
        Filter to a single directory: folder UUID, favorites, uncategorized,
        or domain slug (slug accepted for backward compatibility).
      schema:
        maxLength: 100
        example: aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaaa
        type: string
    - name: domain_group
      required: false
      in: query
      description: >-
        Filter to system folders whose classifier domain slug belongs to
        this domain group (e.g. health, tech). Hides favorites and
        uncategorized.
      schema:
        maxLength: 32
        example: health
        type: string
    - name: created_after
      required: false
      in: query
      description: Only count sessions created on or after this ISO-8601 timestamp.
      schema:
        example: '2026-01-15T00:00:00.000Z'
        type: string
    - name: cursor
      required: false
      in: query
      description: >-
        Cursor from a previous page (last directory id in the prior response).
      schema:
        maxLength: 100
        example: aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaaa
        type: string
    - name: limit
      required: false
      in: query
      schema:
        minimum: 1
        maximum: 30
        default: 20
        type: number
  responses:
    '200':
      description: 'Directories retrieved successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ChatDirectoriesResponseDto'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'


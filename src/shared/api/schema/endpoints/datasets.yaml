validateCombine:
  operationId: DatasetController_validateCombine
  summary: Validate that a set of datasets can be combined
  description: >-
    Synchronous compatibility check. No writes. Returns either
    `{ compatible: true, training_type, total_estimated_rows }` or
    `{ compatible: false, errors: [...] }`.
  tags:
    - Dataset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/CombineValidateDto'
  responses:
    '200':
      description: 'Validation result'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/CombineValidateResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

combineDatasets:
  operationId: DatasetController_combineDatasets
  summary: Combine multiple datasets into a single new Dataset
  description: >-
    Creates a new Dataset row plus DatasetSource lineage rows and dispatches the
    numi combine job. Synchronous — returns when the combined dataset row is
    `ready`. Use `Idempotency-Key` for safe retries.
  tags:
    - Dataset
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID (one per combine attempt). Duplicate keys return
        the same dataset_id rather than re-running the combine.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/CombineDatasetsDto'
  responses:
    '200':
      description: 'Dataset combined successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/CombineDatasetsResponseDto'
    '201':
      description: 'Dataset combined successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/CombineDatasetsResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'


getPreprocessingCredits:
  operationId: DatasetController_getPreprocessingCredits
  tags:
    - Dataset
  parameters:
    - name: dataset_id
      in: path
      required: true
      schema:
        type: string
    - name: pages_to_process
      in: query
      required: false
      description: >-
        Maximum number of pages to process. Documents are included until this
        budget is reached. If omitted, all pages are processed.
      schema:
        type: number
        minimum: 1
    - name: documents_to_process
      in: query
      required: false
      description: >-
        Maximum number of documents to process. If omitted, all documents are
        processed.
      schema:
        type: number
        minimum: 1
  responses:
    "200":
      description: Preprocessing credits estimate retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../shared/schemas.yaml#/PreprocessingCreditsResponseDto"
    "400":
      description: Not a document dataset or invalid state
      content:
        application/json:
          schema:
            $ref: "../shared/schemas.yaml#/ErrorResponse"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../shared/schemas.yaml#/ErrorResponse"
    "404":
      description: Dataset not found
      content:
        application/json:
          schema:
            $ref: "../shared/schemas.yaml#/ErrorResponse"


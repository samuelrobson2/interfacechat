uploadToHuggingFace:
  operationId: DatasetController_uploadToHuggingFace
  tags:
    - Dataset
  parameters:
    - name: dataset_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            quality_gain:
              type: string
              format: binary
            grade:
              type: string
              format: binary
            percentile_chart:
              type: string
              format: binary
            banner:
              type: string
              format: binary
              description: >-
                Optional banner image — placed at the start of the README body
                (after the YAML front matter).
            isPrivate:
              type: boolean
              description: If true, upload is private. Default false (public).
              default: false
  responses:
    '200':
      description: 'Dataset uploaded to HuggingFace successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/MessageResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '404':
      description: 'Dataset not found'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'


# Dataset endpoints - all schemas are imported from shared/schemas.yaml

initiateUpload:
  operationId: DatasetController_initiateUpload
  tags:
    - Dataset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../shared/schemas.yaml#/InitiateDto'
  responses:
    '200':
      description: 'Upload initiated successfully'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/InitiateResponseDto'
    '400':
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'
    '401':
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '../shared/schemas.yaml#/ErrorResponse'

